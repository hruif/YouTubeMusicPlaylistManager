<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Queue Player</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #111216;
      --panel: #1a1c22;
      --panel-alt: #23262e;
      --text: #f4f5f7;
      --muted: #a9afbd;
      --line: #343844;
      --accent: #ff0033;
      --accent-hover: #cc0029;
      --focus: #77a8ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 12px;
      background: var(--panel-alt);
      color: var(--text);
      cursor: pointer;
    }

    button:hover {
      border-color: var(--focus);
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-hover);
    }

    button[aria-pressed="true"] {
      border-color: var(--focus);
      background: #2b3548;
    }

    button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(380px, 1fr) minmax(320px, 420px);
      gap: 18px;
      height: 100vh;
      min-height: 0;
      padding: 18px;
      overflow: hidden;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
      min-height: 0;
    }

    .player-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      position: relative;
    }

    .header {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .muted {
      color: var(--muted);
    }

    #now-playing {
      margin: 8px 0 0;
      line-height: 1.4;
    }

    .player-stage {
      display: flex;
      align-self: center;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
      background: #000;
    }

    #player {
      width: 100% !important;
      height: auto !important;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
    }

    .controls {
      position: relative;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 18px 18px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .queue-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
    }

    .queue-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .queue-title h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    #queue-count {
      white-space: nowrap;
    }

    #queue-list {
      overflow: auto;
      margin: 0;
      padding: 0;
      list-style: none;
      min-height: 0;
    }

    .queue-item {
      display: grid;
      grid-template-columns: 18px 64px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .queue-item.dragging {
      opacity: 0.45;
    }

    .queue-item.drag-over {
      box-shadow: inset 0 2px 0 var(--focus);
    }

    .queue-item.current {
      background: rgba(255, 0, 51, 0.12);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .drag-handle {
      color: var(--muted);
      cursor: grab;
      text-align: center;
      user-select: none;
    }

    .thumbnail-button {
      position: relative;
      display: block;
      width: 64px;
      height: 36px;
      overflow: hidden;
      border: 0;
      border-radius: 4px;
      padding: 0;
      background: #000;
    }

    .thumbnail-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumbnail-button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: none;
    }

    .thumbnail-button::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 11px solid #fff;
      transform: translate(-38%, -50%);
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.75));
      opacity: 0;
      pointer-events: none;
      transition: none;
    }

    .thumbnail-button:hover::before,
    .thumbnail-button:focus-visible::before,
    .thumbnail-button:hover::after,
    .thumbnail-button:focus-visible::after {
      opacity: 1;
    }

    .row-menu {
      position: relative;
    }

    .menu-button {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      font-weight: 700;
      line-height: 1;
    }

    .menu-popover {
      position: absolute;
      right: 0;
      top: 38px;
      z-index: 10;
      min-width: 120px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-alt);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .menu-popover[hidden] {
      display: none;
    }

    .menu-popover button {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
    }

    .song-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
    }

    .song-meta {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      padding: 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    @media (max-width: 860px) {
      .shell {
        grid-template-columns: 1fr;
        overflow: auto;
      }

      .queue-panel {
        min-height: 380px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel player-panel">
      <header class="header">
        <h1 id="queue-title">YouTube Queue</h1>
        <p id="now-playing" class="muted">Loading queue...</p>
      </header>
      <div class="player-stage">
        <div id="player"></div>
      </div>
      <div class="controls">
        <button id="prev-button" type="button">Previous</button>
        <button id="play-button" class="primary" type="button">Play</button>
        <button id="next-button" type="button">Next</button>
        <button id="random-button" type="button" aria-pressed="false">Random: Off</button>
        <button id="shuffle-button" type="button">Shuffle</button>
        <button id="open-button" type="button">Open Source</button>
      </div>
    </section>

    <aside class="panel queue-panel">
      <div class="queue-title">
        <h2>Queue</h2>
        <span id="queue-count" class="muted">0 songs</span>
      </div>
      <ul id="queue-list"></ul>
    </aside>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const queueToken = params.get("queue");
    let queue = [];
    let player = null;
    let currentIndex = 0;
    let playerReady = false;
    let draggedIndex = null;
    let openMenuIndex = null;
    let randomMode = false;

    // The Python app owns the source data; this page owns only the active playback queue.
    const queueTitle = document.getElementById("queue-title");
    const nowPlaying = document.getElementById("now-playing");
    const queueCount = document.getElementById("queue-count");
    const queueList = document.getElementById("queue-list");
    const prevButton = document.getElementById("prev-button");
    const playButton = document.getElementById("play-button");
    const nextButton = document.getElementById("next-button");
    const randomButton = document.getElementById("random-button");
    const shuffleButton = document.getElementById("shuffle-button");
    const openButton = document.getElementById("open-button");

    function setStatus(message) {
      nowPlaying.textContent = message;
    }

    function currentTrack() {
      return queue[currentIndex] || null;
    }

    function thumbnailUrl(track) {
      return track.thumbnailUrl || `https://i.ytimg.com/vi/${encodeURIComponent(track.videoId)}/mqdefault.jpg`;
    }

    function closeMenus() {
      openMenuIndex = null;
      for (const menu of queueList.querySelectorAll(".menu-popover")) {
        menu.hidden = true;
      }
    }

    function updateControls() {
      const hasTracks = queue.length > 0;
      prevButton.disabled = !hasTracks;
      playButton.disabled = !hasTracks;
      nextButton.disabled = !hasTracks;
      randomButton.disabled = !hasTracks;
      randomButton.textContent = randomMode ? "Random: On" : "Random: Off";
      randomButton.setAttribute("aria-pressed", randomMode ? "true" : "false");
      shuffleButton.disabled = queue.length < 2;
      openButton.disabled = !currentTrack() || !currentTrack().sourceUrl;
      queueCount.textContent = `${queue.length} ${queue.length === 1 ? "song" : "songs"}`;
    }

    function renderCurrentTrack() {
      const track = currentTrack();
      if (!track) {
        setStatus("Queue is empty.");
        updateControls();
        return;
      }

      const artist = track.artist || "Unknown Artist";
      const playlist = track.playlist ? ` - ${track.playlist}` : "";
      setStatus(`${track.title || "Unknown Title"} by ${artist}${playlist}`);
      updateControls();
    }

    function renderQueue() {
      queueList.textContent = "";
      if (!queue.length) {
        const item = document.createElement("li");
        item.className = "status";
        item.textContent = "No YouTube songs are available in this queue.";
        queueList.appendChild(item);
        renderCurrentTrack();
        return;
      }

      queue.forEach((track, index) => {
        const item = document.createElement("li");
        item.className = `queue-item${index === currentIndex ? " current" : ""}`;
        item.draggable = true;
        item.dataset.index = String(index);

        item.addEventListener("dragstart", (event) => {
          draggedIndex = index;
          item.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", String(index));
        });
        item.addEventListener("dragover", (event) => {
          event.preventDefault();
          if (draggedIndex !== null && draggedIndex !== index) {
            item.classList.add("drag-over");
          }
        });
        item.addEventListener("dragleave", () => {
          item.classList.remove("drag-over");
        });
        item.addEventListener("drop", (event) => {
          event.preventDefault();
          item.classList.remove("drag-over");
          const sourceIndex = draggedIndex ?? Number(event.dataTransfer.getData("text/plain"));
          moveIndex(sourceIndex, index);
        });
        item.addEventListener("dragend", () => {
          draggedIndex = null;
          item.classList.remove("dragging", "drag-over");
        });

        const dragHandle = document.createElement("div");
        dragHandle.className = "drag-handle";
        dragHandle.textContent = "::";
        dragHandle.title = "Drag to reorder";

        const thumbnailButton = document.createElement("button");
        thumbnailButton.type = "button";
        thumbnailButton.className = "thumbnail-button";
        thumbnailButton.setAttribute("aria-label", `Play ${track.title || "song"}`);
        thumbnailButton.addEventListener("click", () => loadIndex(index));

        const thumbnailImage = document.createElement("img");
        thumbnailImage.alt = "";
        thumbnailImage.loading = "lazy";
        thumbnailImage.src = thumbnailUrl(track);
        thumbnailButton.appendChild(thumbnailImage);

        const text = document.createElement("div");
        const title = document.createElement("div");
        title.className = "song-title";
        title.textContent = track.title || "Unknown Title";
        const meta = document.createElement("div");
        meta.className = "song-meta";
        meta.textContent = `${track.artist || "Unknown Artist"}${track.playlist ? ` - ${track.playlist}` : ""}`;
        text.append(title, meta);

        const rowMenu = document.createElement("div");
        rowMenu.className = "row-menu";

        const menuButton = document.createElement("button");
        menuButton.type = "button";
        menuButton.className = "menu-button";
        menuButton.textContent = "...";
        menuButton.setAttribute("aria-label", "More actions");
        menuButton.addEventListener("click", (event) => {
          event.stopPropagation();
          openMenuIndex = openMenuIndex === index ? null : index;
          renderQueue();
        });

        const menuPopover = document.createElement("div");
        menuPopover.className = "menu-popover";
        menuPopover.hidden = openMenuIndex !== index;
        menuPopover.addEventListener("click", (event) => event.stopPropagation());

        const removeItemButton = document.createElement("button");
        removeItemButton.type = "button";
        removeItemButton.textContent = "Remove";
        removeItemButton.addEventListener("click", () => removeIndex(index));
        menuPopover.appendChild(removeItemButton);
        rowMenu.append(menuButton, menuPopover);

        item.append(dragHandle, thumbnailButton, text, rowMenu);
        queueList.appendChild(item);
      });

      renderCurrentTrack();
    }

    function loadIndex(index) {
      if (!queue.length) {
        return;
      }

      currentIndex = Math.max(0, Math.min(index, queue.length - 1));
      const track = currentTrack();
      if (playerReady && player && track) {
        player.loadVideoById(track.videoId);
      }
      renderQueue();
    }

    function moveIndex(sourceIndex, targetIndex) {
      if (
        sourceIndex === targetIndex ||
        sourceIndex < 0 ||
        targetIndex < 0 ||
        sourceIndex >= queue.length ||
        targetIndex >= queue.length
      ) {
        return;
      }

      const active = currentTrack();
      const [movedTrack] = queue.splice(sourceIndex, 1);
      queue.splice(targetIndex, 0, movedTrack);
      currentIndex = active ? queue.indexOf(active) : 0;
      draggedIndex = null;
      closeMenus();
      renderQueue();
    }

    function playNext() {
      if (!queue.length) {
        return;
      }
      if (randomMode) {
        playRandom();
        return;
      }
      loadIndex((currentIndex + 1) % queue.length);
    }

    function playRandom() {
      if (!queue.length) {
        return;
      }
      loadIndex(Math.floor(Math.random() * queue.length));
    }

    function playPrevious() {
      if (!queue.length) {
        return;
      }
      loadIndex((currentIndex - 1 + queue.length) % queue.length);
    }

    function removeIndex(index) {
      if (index < 0 || index >= queue.length) {
        return null;
      }

      const removedTrack = queue[index];
      const removingCurrent = index === currentIndex;
      queue.splice(index, 1);
      openMenuIndex = null;
      if (currentIndex >= queue.length) {
        currentIndex = Math.max(0, queue.length - 1);
      } else if (index < currentIndex) {
        currentIndex -= 1;
      }

      if (!queue.length) {
        if (playerReady && player) {
          player.stopVideo();
        }
      } else if (removingCurrent) {
        loadIndex(currentIndex);
        return removedTrack;
      }

      renderQueue();
      return removedTrack;
    }

    function removeUnavailableCurrent(errorCode) {
      if (!queue.length) {
        return;
      }

      const failedTrack = currentTrack();
      const failedTitle = failedTrack?.title || "Unavailable video";
      reportUnavailableTrack(failedTrack, errorCode);
      queue.splice(currentIndex, 1);
      openMenuIndex = null;

      if (currentIndex >= queue.length) {
        currentIndex = 0;
      }

      if (!queue.length) {
        if (playerReady && player) {
          player.stopVideo();
        }
        renderQueue();
        setStatus(`Removed unavailable track: ${failedTitle}. No playable songs remain.`);
        return;
      }

      renderQueue();
      setStatus(`Removed unavailable track: ${failedTitle}. Trying next song...`);
      window.setTimeout(() => loadIndex(currentIndex), 75);
    }

    function reportUnavailableTrack(track, errorCode) {
      if (!track || !track.videoId) {
        return;
      }

      fetch("/unavailable", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          videoId: track.videoId,
          title: track.title || "",
          errorCode
        }),
        keepalive: true
      }).catch(() => {});
    }

    function shuffleQueue() {
      if (queue.length < 2) {
        return;
      }

      // Keep the active song at the top so shuffle does not interrupt what is playing.
      const active = currentTrack();
      const rest = queue.filter((_, index) => index !== currentIndex);
      for (let index = rest.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [rest[index], rest[swapIndex]] = [rest[swapIndex], rest[index]];
      }

      queue = active ? [active, ...rest] : rest;
      currentIndex = 0;
      closeMenus();
      renderQueue();
    }

    function toggleRandomMode() {
      randomMode = !randomMode;
      updateControls();
    }

    function togglePlay() {
      if (!playerReady || !player) {
        return;
      }

      const state = player.getPlayerState();
      if (state === window.YT.PlayerState.PLAYING) {
        player.pauseVideo();
        playButton.textContent = "Play";
      } else {
        player.playVideo();
        playButton.textContent = "Pause";
      }
    }

    function openSource() {
      const track = currentTrack();
      if (track && track.sourceUrl) {
        window.open(track.sourceUrl, "_blank", "noopener");
      }
    }

    async function loadQueue() {
      if (!queueToken) {
        throw new Error("No queue token was provided.");
      }

      const response = await fetch(`/queue/${encodeURIComponent(queueToken)}`, { cache: "no-store" });
      if (!response.ok) {
        throw new Error("Queue not found.");
      }

      const payload = await response.json();
      const title = payload.title || "YouTube Queue";
      queueTitle.textContent = title;
      document.title = `${title} - YouTube Queue Player`;
      queue = Array.isArray(payload.tracks)
        ? payload.tracks.filter((track) => (
          track &&
          track.videoId &&
          track.playbackStatus !== "YTM only" &&
          track.playbackStatus !== "Unavailable"
        ))
        : [];
      renderQueue();
    }

    function loadYouTubeApi() {
      const script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(script);
    }

    window.onYouTubeIframeAPIReady = function onYouTubeIframeAPIReady() {
      const track = currentTrack();
      if (!track) {
        return;
      }

      // YouTube playback must go through the iframe API to stay inside supported embed behavior.
      player = new window.YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: track.videoId,
        playerVars: {
          enablejsapi: 1,
          autoplay: 1,
          playsinline: 1,
          origin: window.location.origin,
          rel: 0
        },
        events: {
          onReady: () => {
            playerReady = true;
            renderCurrentTrack();
            player.playVideo();
            playButton.textContent = "Pause";
          },
          onStateChange: (event) => {
            if (event.data === window.YT.PlayerState.ENDED) {
              playNext();
            }
            if (event.data === window.YT.PlayerState.PLAYING) {
              playButton.textContent = "Pause";
            }
            if (event.data === window.YT.PlayerState.PAUSED) {
              playButton.textContent = "Play";
            }
          },
          onError: (event) => {
            removeUnavailableCurrent(event.data);
          }
        }
      });
    };

    prevButton.addEventListener("click", playPrevious);
    playButton.addEventListener("click", togglePlay);
    nextButton.addEventListener("click", playNext);
    randomButton.addEventListener("click", toggleRandomMode);
    shuffleButton.addEventListener("click", shuffleQueue);
    openButton.addEventListener("click", openSource);
    document.addEventListener("click", closeMenus);

    loadQueue()
      .then(loadYouTubeApi)
      .catch((error) => {
        queue = [];
        renderQueue();
        setStatus(error.message);
      });
  </script>
</body>
</html>
