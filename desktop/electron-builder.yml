appId: com.hruif.ytmpm
productName: YouTube Music Playlist Manager
copyright: © hruif

directories:
  output: release
  buildResources: build

# The main + preload are esbuild-bundled into electron-dist/, so NO node_modules need to ship — we
# package only the bundled output + the static renderer. That's the biggest app-specific size win;
# the rest is the unavoidable Chromium runtime.
files:
  - electron-dist/**/*
  - dist/**/*
  - package.json
  # Everything is esbuild/vite-bundled, so nothing in node_modules is needed at runtime — excluding
  # it drops ~25 MB of duplicated youtubei.js/React/etc. from the asar.
  - "!node_modules/**/*"

# The native WKWebView login helper ships as a plain executable in Resources (outside the asar).
extraResources:
  - from: electron-dist/login-helper
    to: login-helper

asar: true
compression: maximum
removePackageScripts: true
# Ship only the en-US Chromium locale pack (drops ~50 other .pak files, several MB).
electronLanguages:
  - en-US

mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch: universal # one DMG that runs on Apple Silicon + Intel
    - target: zip
      arch: universal # zipped .app — the in-app updater downloads this to swap the bundle in place
  # Signed with the Developer ID certificate when one is provided (CSC_LINK + CSC_KEY_PASSWORD, or
  # an identity in the keychain), otherwise left unsigned. Notarized when Apple credentials are in
  # the environment (APPLE_KEYCHAIN_PROFILE, or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
  # APPLE_TEAM_ID); skipped otherwise. See BUILD.md.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Shown in macOS's permission prompt when "Keep this window in front" first controls the browser.
    NSAppleEventsUsageDescription: Lets YouTube Music Playlist Manager open songs in your browser without bringing it to the front.

dmg:
  writeUpdateInfo: false

win:
  target:
    - nsis

linux:
  target:
    - AppImage
  category: AudioVideo
