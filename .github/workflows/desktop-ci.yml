name: desktop-ci

# Lightweight checks for the Tauri rewrite (desktop/): frontend typecheck + unit tests.
# (The full Rust/Tauri bundle build is intentionally not run in CI — too heavy without signing
# setup; it's built locally per desktop/BUILD.md.)

on:
  push:
    paths:
      - "desktop/**"
      - ".nvmrc"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".nvmrc"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm run test
