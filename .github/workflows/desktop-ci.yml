name: desktop-ci

# Lightweight checks for the Tauri rewrite (desktop/): frontend typecheck + unit tests.
# (The full Rust/Tauri bundle build is intentionally not run in CI — too heavy without signing
# setup; it's built locally per desktop/BUILD.md.)

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
